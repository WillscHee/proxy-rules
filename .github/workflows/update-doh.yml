run-name: update-doh-whitelist

on:
  schedule:
    # 每天 00:30 UTC（跟随 HaGeZi 更新周期，错开 AdGuard 更新）
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest HaGeZi DoH-only domains
        run: |
          curl -sSL --fail --retry 3 --max-time 60 \
            "https://hagezi-mirror.dnsbunker.org/wildcard/doh-onlydomains.txt" \
            -o /tmp/doh-onlydomains.txt
          wc -l /tmp/doh-onlydomains.txt

      - name: Extract domains into rules/DoH.txt
        run: python3 scripts/update_doh.py /tmp/doh-onlydomains.txt txt/DoH.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet txt/DoH.txt; then
            git add txt/DoH.txt
            git commit -m "chore: update DoH whitelist"
            git push
          else
            echo "No changes detected."
          fi
