run-name: update-adguard-dns-filters

on:
  schedule:
    # 每天 00:00 UTC（跟随 AdGuard 更新周期）
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest AdGuard SDNS Filter
        run: |
          curl -sSL --fail --retry 3 --max-time 120 \
            "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt" \
            -o /tmp/adguard-sdns-filter.txt
          wc -l /tmp/adguard-sdns-filter.txt

      - name: Extract domains into rules/Adguard-dns-filters-onlydomains.txt
        run: run: python3 scripts/update_adguard_dns.py /tmp/adguard-sdns-filter.txt txt/Adguard-dns-filters-onlydomains.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet txt/Adguard-dns-filters-onlydomains.txt; then
            git add txt/Adguard-dns-filters-onlydomains.txt
            git commit -m "chore: update AdGuard DNS filters domains"
            git push
          else
            echo "No changes detected."
          fi
